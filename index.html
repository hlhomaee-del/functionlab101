<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Functions Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--border:rgba(255,255,255,0.08);
  --blue:#5b8dee;--purple:#9b6dff;--pink:#ff6b9d;--green:#4ecdc4;
  --orange:#ff8a50;--red:#ff5252;--yellow:#ffd740;--cyan:#40e0d0;--gold:#ffab40;
  --text:#f5f5f7;--text2:#b0b8d1;--text3:#6b7394;
  --font:'Nunito',sans-serif;--mono:'Fira Code',monospace;
  --r:20px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:18px;line-height:1.75;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(91,141,238,0.07),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(155,109,255,0.05),transparent 60%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--blue);border-radius:4px}
.hidden{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:2}
.wrap-wide{max-width:1100px;margin:0 auto;padding:0 24px;position:relative;z-index:2}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:16px 36px;border:none;border-radius:60px;font-family:var(--font);font-weight:800;font-size:17px;cursor:pointer;transition:all .3s;letter-spacing:0.3px}
.btn:hover{transform:translateY(-3px)}.btn:active{transform:scale(0.97)}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 6px 25px rgba(91,141,238,0.3)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--cyan));color:#0a2a27;box-shadow:0 6px 25px rgba(78,205,196,0.3)}
.btn-gold{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#2a1a00;box-shadow:0 6px 25px rgba(255,215,64,0.3)}
.btn-pink{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 25px rgba(255,107,157,0.3)}
.btn-ghost{background:rgba(91,141,238,0.1);color:var(--blue);border:2px solid rgba(91,141,238,0.25)}
.btn-ghost:hover{background:rgba(91,141,238,0.2)}
.btn-sm{padding:11px 24px;font-size:15px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}

/* Nav */
.topnav{position:sticky;top:0;z-index:100;background:rgba(15,15,26,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.topnav .wrap-wide{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:900;font-size:22px;cursor:pointer;display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-pills{display:flex;align-items:center;gap:14px}
.pill{background:var(--card);border:1px solid var(--border);border-radius:50px;padding:8px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.pill .pv{color:var(--yellow);font-family:var(--mono)}
.xbar{width:140px;height:7px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden}
.xbar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));border-radius:10px;transition:width .8s ease}

/* ═══ PHASES ═══ */
.phase{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 0}
.phase-card{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:48px;max-width:700px;width:100%;text-align:center;animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.phase-card h1{font-weight:900;font-size:36px;margin-bottom:16px;line-height:1.2}
.phase-card h2{font-weight:800;font-size:28px;margin-bottom:14px}
.phase-card p{color:var(--text2);font-size:19px;margin-bottom:24px;line-height:1.8}

/* Warm-up challenge cards */
.challenge{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:44px;max-width:750px;width:100%;animation:fadeUp .5s ease}
.challenge h2{font-weight:800;font-size:26px;margin-bottom:8px}
.challenge .ch-num{font-size:14px;font-weight:700;color:var(--blue);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.challenge p{color:var(--text2);font-size:18px;margin-bottom:20px;line-height:1.8}
.ch-options{display:flex;flex-direction:column;gap:12px;margin:20px 0}
.ch-opt{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px 24px;cursor:pointer;transition:all .3s;font-size:17px;font-weight:600;text-align:left}
.ch-opt:hover{border-color:var(--blue);background:rgba(91,141,238,0.06);transform:translateX(4px)}
.ch-opt.picked{border-color:var(--blue);background:rgba(91,141,238,0.1)}
.ch-opt.correct{border-color:var(--green)!important;background:rgba(78,205,196,0.1)!important}
.ch-opt.wrong{border-color:var(--red)!important;background:rgba(255,82,82,0.06)!important}
.ch-opt.done{pointer-events:none}
.ch-fb{margin-top:16px;padding:20px;border-radius:14px;font-size:17px;line-height:1.7;animation:fadeUp .3s ease}
.ch-fb.ok{background:rgba(78,205,196,0.08);border:2px solid rgba(78,205,196,0.2)}
.ch-fb.no{background:rgba(255,82,82,0.06);border:2px solid rgba(255,82,82,0.15)}

/* Code */
.code{background:#0a0a1a;border:2px solid rgba(91,141,238,0.12);border-radius:16px;padding:24px 28px;font-family:var(--mono);font-size:17px;line-height:2.2;overflow-x:auto;margin:16px 0;text-align:left}
.code .ln{color:var(--text3);margin-right:20px;user-select:none;min-width:24px;display:inline-block;text-align:right;font-size:14px}
.code .line{display:block;padding:2px 28px;margin:0 -28px;border-left:4px solid transparent;transition:all .3s}
.code .line.hl{background:rgba(91,141,238,0.1);border-left-color:var(--blue)}
.code .line.hlg{background:rgba(78,205,196,0.08);border-left-color:var(--green)}
.kw{color:#c792ea}.fn{color:#82aaff}.st{color:#c3e88d}.cm{color:#546e7a;font-style:italic}.nm{color:#f78c6c}.bi{color:#89ddff}.pm{color:#ffcb6b}

/* Progress dots */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:28px}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.1);transition:all .3s}
.dot.active{background:var(--blue);box-shadow:0 0 12px rgba(91,141,238,0.4)}
.dot.done{background:var(--green)}

/* Results */
.result-bar{height:12px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,0.06);margin:8px 0 20px}
.result-fill{height:100%;border-radius:10px;transition:width 1s ease}
.result-fill.high{background:linear-gradient(90deg,var(--green),var(--cyan))}
.result-fill.med{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.result-fill.low{background:linear-gradient(90deg,var(--orange),var(--red))}

/* Prereq cards */
.prereq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:20px 0}
.pq-card{background:rgba(255,255,255,0.03);border:2px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:all .3s;text-align:center}
.pq-card:hover{border-color:var(--blue);transform:translateY(-3px)}
.pq-card.mastered{border-color:var(--green);background:rgba(78,205,196,0.06)}
.pq-card .pq-icon{font-size:32px;margin-bottom:8px;display:block}
.pq-card h4{font-weight:700;font-size:16px}
.pq-card p{font-size:13px;color:var(--text3);margin-top:4px}

/* Teach blocks */
.teach{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:36px;margin:28px 0;position:relative;overflow:hidden;font-size:18px}
.teach::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.teach.blue::before{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.teach.purple::before{background:linear-gradient(90deg,var(--purple),var(--pink))}
.teach.green::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.teach.orange::before{background:linear-gradient(90deg,var(--orange),var(--yellow))}
.teach.red::before{background:linear-gradient(90deg,var(--red),var(--pink))}
.teach.gold::before{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.teach.pink::before{background:linear-gradient(90deg,var(--pink),var(--purple))}
.teach h3{font-weight:800;font-size:24px;margin-bottom:14px}
.teach p{color:var(--text2);margin-bottom:14px;font-size:18px;line-height:1.8}
.teach strong{color:var(--text)}

/* Station grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;padding-bottom:80px}
.sc{position:relative;border-radius:var(--r);padding:32px;overflow:hidden;cursor:pointer;transition:all .4s;border:2px solid transparent}
.sc:hover{transform:translateY(-8px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.sc.locked{opacity:.35;cursor:not-allowed;filter:grayscale(0.5)}.sc.locked:hover{transform:none;box-shadow:none}
.sc[data-i="0"]{background:linear-gradient(135deg,#1a237e,#283593)}
.sc[data-i="1"]{background:linear-gradient(135deg,#4a148c,#6a1b9a)}
.sc[data-i="2"]{background:linear-gradient(135deg,#880e4f,#ad1457)}
.sc[data-i="3"]{background:linear-gradient(135deg,#004d40,#00695c)}
.sc[data-i="4"]{background:linear-gradient(135deg,#1b5e20,#2e7d32)}
.sc[data-i="5"]{background:linear-gradient(135deg,#e65100,#bf360c)}
.sc[data-i="6"]{background:linear-gradient(135deg,#01579b,#0277bd)}
.sc[data-i="7"]{background:linear-gradient(135deg,#f57f17,#f9a825)}
.sc[data-i="8"]{background:linear-gradient(135deg,#b71c1c,#c62828)}
.sc[data-i="9"]{background:linear-gradient(135deg,#1a237e,#0d47a1)}
.sc[data-i="10"]{background:linear-gradient(135deg,#e65100,#ff6f00)}
.sc[data-i="11"]{background:linear-gradient(135deg,#4a148c,#7b1fa2)}
.sc-icon{font-size:44px;margin-bottom:16px;display:block}
.sc-num{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:0.7;margin-bottom:6px}
.sc h3{font-weight:800;font-size:22px;margin-bottom:8px}
.sc p{font-size:16px;opacity:0.85;margin-bottom:20px}
.sc-bot{display:flex;align-items:center;justify-content:space-between}
.sc-st{font-size:13px;font-weight:700;padding:6px 16px;border-radius:50px}
.sc-st.done{background:rgba(78,205,196,0.25);color:var(--green)}
.sc-st.open{background:rgba(255,255,255,0.15);color:#fff}
.sc-st.lock{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4)}
.sc-ent{font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;color:#fff}.sc:hover .sc-ent{opacity:1}

/* Out, Quiz, etc - same as before */
.out{background:#0a0a1a;border:2px solid rgba(78,205,196,0.2);border-radius:16px;padding:20px 24px;font-family:var(--mono);font-size:16px;min-height:60px;color:var(--green);margin:16px 0}
.out-label{font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.quiz{margin:32px 0;background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:36px}
.quiz-q{font-weight:700;font-size:20px;margin-bottom:20px;line-height:1.6}
.qo{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.1);border-radius:14px;padding:18px 24px;cursor:pointer;transition:all .3s;font-size:17px;font-weight:500;margin-bottom:12px}
.qo:hover{border-color:var(--blue);background:rgba(91,141,238,0.06)}
.qo.ok{border-color:var(--green)!important;background:rgba(78,205,196,0.1)!important}
.qo.no{border-color:var(--red)!important;background:rgba(255,82,82,0.06)!important}
.qo.dn{pointer-events:none}
.qfb{margin-top:16px;padding:20px;border-radius:14px;font-size:17px;line-height:1.8;animation:fadeUp .3s ease}
.qfb.qok{background:rgba(78,205,196,0.08);border:2px solid rgba(78,205,196,0.2)}
.qfb.qno{background:rgba(255,82,82,0.06);border:2px solid rgba(255,82,82,0.15)}
.strat{margin-top:16px;padding:20px;background:rgba(255,215,64,0.05);border:2px solid rgba(255,215,64,0.12);border-radius:14px;font-size:16px}
.strat b{color:var(--yellow);font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:768px){.two{grid-template-columns:1fr}}
.ii{background:rgba(91,141,238,0.08);border:2px solid var(--blue);border-radius:10px;padding:10px 16px;color:var(--text);font-family:var(--mono);font-size:16px;outline:none}
.ii.iok{border-color:var(--green)!important}.ii.ino{border-color:var(--red)!important}
.is{background:rgba(91,141,238,0.08);border:2px solid var(--blue);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:15px;cursor:pointer}
.is option{background:var(--card);color:var(--text)}
.conveyor{background:rgba(255,255,255,0.02);border:2px solid var(--border);border-radius:16px;padding:28px;margin:20px 0;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:16px}
.cv{padding:10px 20px;background:rgba(78,205,196,0.12);border:2px solid var(--green);border-radius:10px;color:var(--green);font-weight:700}
.cva{color:var(--yellow);font-size:24px;font-weight:900}

.badge-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:999;background:var(--card2);border:3px solid var(--yellow);border-radius:28px;padding:52px 64px;text-align:center;box-shadow:0 0 100px rgba(255,215,64,0.25);transition:transform .5s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.badge-pop.show{transform:translate(-50%,-50%) scale(1)}
.confetti{position:fixed;border-radius:3px;z-index:9999;pointer-events:none;animation:cfall 3s ease-in forwards}
@keyframes cfall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(900deg);opacity:0}}
.toast{position:fixed;bottom:100px;right:32px;z-index:500;padding:14px 28px;border-radius:60px;font-weight:800;font-size:17px;animation:toastUp 1.8s ease forwards;pointer-events:none;color:var(--yellow);background:rgba(255,215,64,0.12);border:2px solid rgba(255,215,64,0.3)}
@keyframes toastUp{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.xp-float{position:fixed;bottom:24px;right:24px;z-index:50}
.xp-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:14px 24px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.xp-val{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--yellow)}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-size:16px;font-weight:600;cursor:pointer;margin-bottom:28px}
.back-link:hover{color:var(--blue)}

.foot{text-align:center;padding:60px 0;border-top:1px solid var(--border);font-size:16px;color:var(--text3);z-index:2;position:relative}
.foot span{color:var(--yellow);font-weight:700}

/* Output demonstrations and foundation checks */
.output-demo{margin:22px 0;background:rgba(255,255,255,0.025);border:2px solid rgba(64,224,208,0.18);border-radius:18px;padding:22px}
.flow-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.dotstream{display:flex;align-items:center;gap:5px;min-width:150px;height:26px;position:relative}
.dotstream span{width:7px;height:7px;border-radius:50%;background:var(--cyan);opacity:.25;animation:dotPulse 1.8s infinite ease-in-out}
.dotstream span:nth-child(1){animation-delay:.05s}.dotstream span:nth-child(2){animation-delay:.15s}.dotstream span:nth-child(3){animation-delay:.25s}.dotstream span:nth-child(4){animation-delay:.35s}.dotstream span:nth-child(5){animation-delay:.45s}.dotstream span:nth-child(6){animation-delay:.55s}.dotstream span:nth-child(7){animation-delay:.65s}
.dotstream:after{content:'➜';color:var(--yellow);font-size:24px;font-weight:900;margin-left:8px;animation:arrowPush 1.8s infinite ease-in-out}
@keyframes dotPulse{0%,100%{transform:scale(.7);opacity:.2}45%{transform:scale(1.35);opacity:1}}
@keyframes arrowPush{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(10px);opacity:1}}
.monitor-wrap{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:220px}
.output-label-row{display:flex;justify-content:flex-end;margin:8px 0 8px 0;padding-right:18%}
.screen-label{display:inline-flex;align-items:center;background:rgba(64,224,208,.16);border:1px solid rgba(64,224,208,.42);color:var(--cyan);border-radius:999px;padding:6px 14px;font-family:var(--font);font-weight:900;font-size:12px;letter-spacing:.7px;text-transform:uppercase;line-height:1.2;box-shadow:0 0 16px rgba(64,224,208,.12)}
.monitor{background:#050812;border:3px solid rgba(78,205,196,0.35);border-radius:16px;min-width:220px;min-height:110px;box-shadow:0 0 28px rgba(64,224,208,.1), inset 0 0 25px rgba(64,224,208,.04);position:relative;padding:20px;text-align:center;font-family:var(--mono)}
.monitor .screen-value{display:block;color:var(--green);font-size:26px;font-weight:900;animation:riseValue 1.5s infinite ease-in-out;text-align:left;white-space:normal}
.monitor .screen-line{display:block;line-height:1.55}
.monitor .screen-error{display:block;color:var(--red);font-size:17px;line-height:1.6;text-align:left;white-space:pre-wrap;word-break:break-word;animation:riseValue 1.5s infinite ease-in-out}
@keyframes riseValue{0%{opacity:.2;transform:translateY(14px) scale(.96)}45%,80%{opacity:1;transform:translateY(0) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
.note-box{background:rgba(255,215,64,0.07);border:2px solid rgba(255,215,64,0.18);border-radius:16px;padding:18px 20px;margin:18px 0;color:var(--text2)}
.note-box strong{color:var(--yellow)}
.brace-demo{margin:18px 0;background:rgba(255,255,255,.025);border:2px solid rgba(155,109,255,.18);border-radius:18px;padding:18px}
.brace-inside{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:stretch}
.curly-brace{font-family:Georgia,serif;font-size:118px;line-height:.78;color:var(--purple);animation:braceGrow 1.7s ease-in-out infinite alternate;display:flex;align-items:center}
@keyframes braceGrow{from{transform:scaleY(.82);opacity:.55}to{transform:scaleY(1);opacity:1}}
.brace-lines{display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:16px}
.brace-line{padding:8px 12px;border-radius:10px;background:rgba(155,109,255,.08);border:1px solid rgba(155,109,255,.18)}
.always-line{padding:8px 12px;border-radius:10px;background:rgba(255,215,64,.07);border:1px solid rgba(255,215,64,.18);font-family:var(--mono);font-size:16px;margin-top:10px}
.error-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.err-card{background:rgba(255,82,82,.06);border:2px solid rgba(255,82,82,.15);border-radius:16px;padding:16px}
.err-card h4{color:var(--red);font-size:17px;margin-bottom:6px}.err-card p{font-size:15px;margin:0;color:var(--text2)}


/* Station 1 and 2 beginner bridge updates */
.side-legend{float:right;width:210px;margin:6px 0 16px 18px;padding:12px 12px 10px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 26px rgba(0,0,0,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.side-legend h5{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--text2);margin:0 0 8px 0;font-weight:900}
.legend-row{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:12.5px;font-weight:800;color:var(--text2);line-height:1.25}
.legend-dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:0 0 16px;border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 3px 8px rgba(0,0,0,.22)}
.legend-dot.fn{background:#3f8cff}
.legend-dot.param{background:#ff7a00}
.legend-dot.arg{background:#c8ff00}
.legend-dot.call{background:#ff1493}
.legend-dot.ret{background:#39ff14}
.legend-dot.in{background:#00e5ff}

<body>

<div class="badge-pop" id="bp"><span style="font-size:72px;display:block;margin-bottom:16px" id="bpI">🏆</span><div style="font-weight:900;font-size:28px;color:var(--yellow)" id="bpT">Badge!</div><div style="color:var(--text2);font-size:17px;margin-top:8px">You unlocked a new badge!</div></div>

<nav class="topnav" id="topnav"><div class="wrap-wide">
  <div class="logo" onclick="goHome()"><div class="logo-icon">⚗️</div> Function Lab</div>
  <div class="nav-pills">
    <div class="pill">⭐ <span class="pv" id="nXP">0</span> XP</div>
    <div class="pill">🏆 <span class="pv" id="nB">0</span></div>
    <div class="xbar"><div class="xbar-fill" id="nBar" style="width:0%"></div></div>
  </div>
</div></nav>

<div class="xp-float" id="xpFloat"><div class="xp-card">⭐ <span class="xp-val" id="xpD">0</span></div></div>

<main id="app"></main>

<footer class="foot"><div class="wrap">Instructional design for educational use</div></footer>

<script>
// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
const S={xp:0,badges:[],done:[],ans:{},name:'',intake:null,phase:'welcome'};
async function load(){try{const r=await window.storage.get('pfl4');if(r?.value)Object.assign(S,JSON.parse(r.value))}catch(e){}
  ensureSeed();
  if(S.phase==='lab')showLab();else if(S.phase==='prereqs')showPrereqs();else if(S.phase==='intake')startIntake();else showWelcome();
  updUI();}
async function save(){try{await window.storage.set('pfl4',JSON.stringify(S))}catch(e){}}

function ensureSeed(){
  if(!S.seed){S.seed=Math.floor(Math.random()*1000000000);save();}
}
function hashKey(key){
  let h=2166136261;
  const s=String(key)+'|'+String(S.seed||0);
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function randFromKey(key){
  let x=hashKey(key);
  x^=x<<13;x^=x>>>17;x^=x<<5;
  return (x>>>0)/4294967296;
}
function shuffleIndices(key,n){
  const a=Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(randFromKey(key+':'+i)*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function addXP(n){S.xp+=n;save();updUI();toast(`+${n} XP`);const e=document.getElementById('xpD');if(e){e.style.transform='scale(1.4)';setTimeout(()=>e.style.transform='',350)}}
function earnBadge(n,ic){if(S.badges.find(b=>b.n===n))return;S.badges.push({n,ic});save();updUI();confetti();const p=document.getElementById('bp');document.getElementById('bpI').textContent=ic;document.getElementById('bpT').textContent=n;p.classList.add('show');setTimeout(()=>p.classList.remove('show'),3000)}
function fin(i){if(!S.done.includes(i)){S.done.push(i);save();updUI()}}
function updUI(){
  const x=document.getElementById('xpD'),nb=document.getElementById('nB'),nx=document.getElementById('nXP');
  if(x)x.textContent=S.xp;if(nb)nb.textContent=S.badges.length;if(nx)nx.textContent=S.xp;
  const p=Math.round(S.done.length/12*100);
  const b=document.getElementById('nBar');if(b)b.style.width=p+'%';
}
function confetti(){const cols=['#5b8dee','#9b6dff','#4ecdc4','#ff8a50','#ff6b9d','#ffd740','#40e0d0','#ff5252'];for(let i=0;i<55;i++){const p=document.createElement('div');p.className='confetti';p.style.cssText=`left:${Math.random()*100}vw;background:${cols[~~(Math.random()*cols.length)]};animation-delay:${Math.random()*.7}s;width:${7+Math.random()*10}px;height:${7+Math.random()*10}px;top:-20px`;document.body.appendChild(p);setTimeout(()=>p.remove(),3800)}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function hl(t){
  // Step 1: Escape only & and < (> is safe in HTML text content)
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  // Step 2: Strings first (so keywords inside strings aren't highlighted)
  t = t.replace(/(["'])(.*?)\1/g,'<span class="st">$1$2$1</span>');
  // Step 3: Comments
  t = t.replace(/(#[^<]*)/g,'<span class="cm">$1</span>');
  // Step 4: Keywords (only outside of already-wrapped spans)
  t = t.replace(/\b(def|return|import|if|else|elif|for|while|in|and|or|not|True|False|None)\b/g,'<span class="kw">$1</span>');
  // Step 5: Built-in functions
  t = t.replace(/\b(print|input|int|float|str|len|sum|max|min|round|range|type|abs)\b(?=\()/g,'<span class="bi">$1</span>');
  // Step 6: Numbers
  t = t.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
  // Step 7: module names
  t = t.replace(/\b(math|random)\b/g,'<span class="bi">$1</span>');
  return t;
}
function cS(ls){return`<div class="code">${ls.map((l,i)=>`<span class="line"><span class="ln">${i+1}</span>${hl(l||' ')}</span>`).join('\n')}</div>`}

function escHTML(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function simpleOutputDemo(codeLines, output, label='Python output'){
  const isError = /Error|Traceback|invalid syntax|not defined/i.test(output);
  let value;
  if(isError){
    value = `<span class="screen-error">${escHTML(output)}</span>`;
  } else {
    const lines = String(output).split(/\n/).map(line=>`<span class="screen-line">${escHTML(line)}</span>`).join('');
    value = `<span class="screen-value">${lines}</span>`;
  }
  return `<div class="output-demo compact-output">${cS(codeLines)}<div class="output-label-row"><div class="screen-label">${escHTML(label)}</div></div><div class="monitor-wrap"><div class="monitor">${value}</div></div></div>`;
}

function outputDemo(codeLines, output, label='This is what your screen will display'){
  const isError = /Error|Traceback|invalid syntax|not defined/i.test(output);
  let value;
  if(isError){
    value = `<span class="screen-error">${escHTML(output)}</span>`;
  } else {
    const lines = String(output).split(/\n/).map(line=>`<span class="screen-line">${escHTML(line)}</span>`).join('');
    value = `<span class="screen-value">${lines}</span>`;
  }
  const labelText = label.includes('Python output') ? label : `${label} (Python output)`;
  return `<div class="output-demo">${cS(codeLines)}<div class="output-label-row"><div class="screen-label">${escHTML(labelText)}</div></div><div class="flow-row"><div class="dotstream"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="monitor-wrap"><div class="monitor">${value}</div></div></div></div>`;
}
function explainBox(text){return `<div class="note-box"><strong>What this means:</strong> ${text}</div>`}
function braceDemo(){return `<div class="brace-demo"><div class="brace-inside"><div class="curly-brace">{</div><div class="brace-lines"><div class="brace-line">print("Adult") <span style="color:var(--green)">inside the if</span></div><div class="brace-line">print("Can vote") <span style="color:var(--green)">also inside</span></div></div></div><div class="always-line">print("Done") <span style="color:var(--yellow)">not inside the if; no indentation, so it always runs</span></div><div class="note-box"><strong>Notice:</strong> The purple bracket only includes the two indented lines. <code>print("Done")</code> is outside the bracket because it is not indented.</div></div>`}


// ══════════════════════════════════════
// PHASE 1: WELCOME
// ══════════════════════════════════════
function showWelcome(){
  S.phase='welcome';save();scrollTo(0,0);
  document.getElementById('topnav').style.display='none';
  document.getElementById('xpFloat').style.display='none';
  document.getElementById('app').innerHTML=`
  <div class="phase"><div class="wrap"><div class="phase-card">
    <div style="font-size:72px;margin-bottom:20px">⚗️</div>
    <h1>Welcome to the<br><span style="color:var(--blue)">Python Functions</span> Lab</h1>
    <p>This isn't a lecture. This is a laboratory where you'll <strong style="color:var(--text)">discover</strong> how Python functions work by doing, predicting, and building; at your own pace.</p>
    <p style="font-size:17px">First, let's find out where you're starting from. No grades, no pressure; just a quick warm-up so we can guide you to the right place.</p>
    <div style="margin-top:12px">
      <label style="font-weight:700;font-size:18px;display:block;margin-bottom:10px">What should we call you?</label>
      <input type="text" id="nameInput" class="ii" style="width:260px;font-size:18px;text-align:center" placeholder="Your first name" onkeydown="if(event.key==='Enter')startIntake()">
    </div>
    <div style="margin-top:28px">
      <button class="btn btn-blue" onclick="startIntake()">Let's Go! →</button>
    </div>
    <div style="margin-top:20px">
      <button class="btn btn-ghost btn-sm" onclick="skipToLab()" style="font-size:13px">I already know Python basics; skip to the lab →</button>
    </div>
  </div></div></div>`;
}

function skipToLab(){S.name=document.getElementById('nameInput')?.value||'Explorer';S.intake={score:6,areas:{variables:true,print:true,indent:true,expressions:true,errors:true,running:true}};S.phase='lab';save();showLab()}

// ══════════════════════════════════════
// PHASE 2: INTAKE (Hidden Assessment)
// ══════════════════════════════════════
const INTAKE=[
  {q:"Which of these correctly stores the number 25 in a variable called <code>age</code>?",code:[],
    opts:["<code>age = 25</code>","<code>age == 25</code>","<code>25 = age</code>","<code>age : 25</code>"],
    correct:0,area:'variables',
    fb:["Correct. A single <code>=</code> stores a value. <code>age = 25</code> creates the variable <code>age</code> and puts 25 inside it.","<code>==</code> compares two things. It asks, <em>Is age equal to 25?</em> It does not store anything. Use one <code>=</code> for storage and two <code>==</code> for comparison.","The storage name must be on the left. Python reads this as: put the right-side value into the left-side variable name.","A colon starts a block after words like <code>if</code>, <code>for</code>, and <code>def</code>. It does not store a value in a variable."]},
  {q:"A variable <code>name</code> stores <code>\"Maya\"</code>. Which code displays <strong>Hello Maya</strong> on screen?",code:['name = "Maya"'],
    opts:["<code>print(\"Hello\", name)</code>","<code>display(\"Hello\", name)</code>","<code>print Hello, name</code>","<code>print(\"Hello\", \"name\")</code>"],
    correct:0,area:'print',
    fb:["Correct. <code>print()</code> displays output. <code>name</code> has no quotes, so Python opens the variable and uses the value inside it: Maya.","<code>display</code> is not the basic Python command for screen output in this lesson. Use <code>print()</code>.","Python 3 requires parentheses with <code>print()</code>. Without parentheses, the line is not valid Python syntax.","Quotes change the meaning. <code>\"name\"</code> is the literal word name; <code>name</code> without quotes means Python should look inside the variable."]},
  {q:"Which of these code blocks will run <strong>without</strong> causing an error?",code:[],
    opts:[
      "<code>if score > 90:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Great!\")</code>",
      "<code>if score > 90<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Great!\")</code>",
      "<code>if score > 90:<br>print(\"Great!\")</code>",
      "<code>if (score > 90)<br>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Great!\")</code>"
    ],
    correct:0,area:'indent',
    fb:["Correct. It has the required pieces: <code>if</code>, a condition, a colon, and an indented line that belongs inside the <code>if</code> block.","The colon is missing. Python needs <code>:</code> before the indented block begins.","The colon is present, but the action line is not indented. Python cannot tell what belongs inside the <code>if</code> block.","Parentheses around the condition are optional, but the colon is not optional. This line is missing <code>:</code>."]},
  {q:"Which line correctly stores the calculation in a variable named <code>result</code> without displaying it yet?",code:[],
    opts:["<code>result = 5 + 3 * 2</code>","<code>print(5 + 3 * 2)</code>","<code>result: 5 + 3 * 2</code>","<code>result == 5 + 3 * 2</code>"],
    correct:0,area:'expressions',
    fb:["Correct. This stores the calculated value in <code>result</code>. It does not display anything until you write <code>print(result)</code>.","This displays the calculation on the screen, but it does not store the value in a variable named <code>result</code>.","A colon does not store the answer. Use <code>=</code> when you want Python to save a value in a variable.","<code>==</code> compares; it does not store. This asks whether <code>result</code> is equal to that expression, and it can also fail if <code>result</code> was never created."]},
  {q:"A student wrote four programs. Which one will <strong>cause an error</strong> when they click Run?",code:[],
    opts:[
      "<code>greeting = \"Hello\"<br>print(greeting)</code>",
      "<code>x = 10<br>print(x + 5)</code>",
      "<code>print(message)</code>",
      "<code>name = \"Lina\"<br>print(\"Hi\", name)</code>"
    ],
    correct:2,area:'errors',
    fb:["This works. The variable is created first, then printed.","This works. Python stores 10 in <code>x</code>, then calculates and displays 15.","Correct. <code>message</code> was never created. Python looks for that name, cannot find it, and raises a <code>NameError</code>.","This works. The variable is created first, then used in the <code>print()</code> statement."]},
  {q:"Which code correctly asks the user to type their name and stores the response?",code:[],
    opts:["<code>name = input(\"Your name: \")</code>","<code>input(\"Your name: \") = name</code>","<code>name = ask(\"Your name: \")</code>","<code>name: input(\"Your name: \")</code>"],
    correct:0,area:'running',
    fb:["Correct. <code>input()</code> asks the user for information; <code>=</code> stores the typed response in <code>name</code>.","The storage name goes on the left side of <code>=</code>. A function call cannot be used as the storage container.","<code>ask()</code> is not the Python function used here. Use <code>input()</code>.","A colon does not save the response. Use <code>=</code> to store what the user typed."]}
]

let intakeStep=0;
let intakeScore={variables:0,print:0,indent:0,expressions:0,errors:0,running:0};

function startIntake(){
  S.name=document.getElementById('nameInput')?.value||'Explorer';
  S.phase='intake';save();
  intakeStep=0;
  intakeScore={variables:0,print:0,indent:0,expressions:0,errors:0,running:0};
  document.getElementById('topnav').style.display='none';
  document.getElementById('xpFloat').style.display='none';
  scrollTo(0,0);
  renderIntakeStep();
}

function renderIntakeStep(){
  if(intakeStep>=INTAKE.length){finishIntake();return}
  ensureSeed();
  const q=INTAKE[intakeStep];
  const order=shuffleIndices('warmup-'+intakeStep,q.opts.length);
  const dots=INTAKE.map((_,i)=>`<div class="dot${i<intakeStep?' done':i===intakeStep?' active':''}"></div>`).join('');
  document.getElementById('app').innerHTML=`
  <div class="phase"><div class="wrap"><div class="challenge">
    <div class="dots">${dots}</div>
    <div class="ch-num">Warm-Up ${intakeStep+1} of ${INTAKE.length}</div>
    <h2>${q.q}</h2>
    ${q.code.length ? cS(q.code) : ''}
    <div class="ch-options" id="chOpts">
      ${order.map(orig=>`<div class="ch-opt" data-idx="${orig}" onclick="pickIntake(${intakeStep},${orig})">${q.opts[orig]}</div>`).join('')}
    </div>
    <div id="chFb"></div>
  </div></div></div>`;
}

function pickIntake(step,sel){
  const q=INTAKE[step];
  const opts=document.querySelectorAll('#chOpts .ch-opt');
  opts.forEach((o)=>{
    const orig=Number(o.dataset.idx);
    o.classList.add('done');
    if(orig===q.correct)o.classList.add('correct');
    if(orig===sel&&sel!==q.correct)o.classList.add('wrong');
  });
  const ok=sel===q.correct;
  if(ok){intakeScore[q.area]=1;addXP(5)}
  document.getElementById('chFb').innerHTML=`
    <div class="ch-fb ${ok?'ok':'no'}"><strong>${ok?'✓ Correct.':'Not quite.'}</strong> ${q.fb[sel]}</div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-blue btn-sm" onclick="intakeStep++;renderIntakeStep()">Continue →</button></div>`;
}

function finishIntake(){
  const total=Object.values(intakeScore).reduce((a,b)=>a+b,0);

  S.intake={score:total,areas:Object.fromEntries(Object.entries(intakeScore).map(([k,v])=>[k,v===1]))};
  S.phase=level==='ready'?'lab':'prereqs';save();

  const weak=Object.entries(intakeScore).filter(([_,v])=>v===0).map(([k])=>k);
  const strong=Object.entries(intakeScore).filter(([_,v])=>v===1).map(([k])=>k);

  document.getElementById('app').innerHTML=`
  <div class="phase"><div class="wrap"><div class="phase-card" style="max-width:800px">
    <div style="font-size:56px;margin-bottom:16px">${level==='ready'?'🚀':level==='almost'?'💪':'🌱'}</div>

    ${weak.length?`<p style="color:var(--orange);font-size:16px;margin-bottom:8px">⚡ Could use review: ${weak.map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join(', ')}</p>`:''}
    <div style="margin-top:32px">
      ${level==='ready'?`
        <p style="color:var(--green);font-size:20px;font-weight:700;margin-bottom:16px">🚀 You're ready for the Function Lab!</p>
        <button class="btn btn-green" onclick="showLab()">Enter the Lab →</button>

        <p style="font-size:18px;margin-bottom:16px">We recommend a quick refresher on a few concepts before diving into functions.</p>

function showPrereqLesson(id){

    variables:{title:'📦 Variables: Named Containers',body:`

    expressions:{title:'🔢 Expressions: Code First, Math Second',body:`
      <p>An expression is a piece of code that Python can evaluate into a value. The important part here is not just the math; it is whether the code <strong>stores</strong> the value, <strong>prints</strong> the value, or only <strong>compares</strong> something.</p>

      ${Q('pe1','Which line stores the value but does not display it yet?', ['<code>result = 5 + 3 * 2</code>','<code>print(5 + 3 * 2)</code>','<code>result == 5 + 3 * 2</code>'],0,
        ['Correct. The value is saved in <code>result</code>. Nothing appears on the screen until a print statement runs.','This displays the value; it does not store it in <code>result</code>.','This compares <code>result</code> to the expression. It does not store anything.'],

      </div>
      ${outputDemo(['print(greeting)'],'NameError: name \'greeting\' is not defined','This is what your screen will display as an error message')}
      ${explainBox('<code>greeting</code> was never created. Python cannot print the value inside a variable if the variable does not exist.')}
      ${outputDemo(['print("Hello"'],'SyntaxError: ( was never closed','This is what your screen will display as an error message')}
      ${explainBox('Python sees an opening parenthesis, but it never sees the closing parenthesis. That is a grammar problem, so it is a <code>SyntaxError</code>.')}
      ${Q('per1','Which code would create <code>NameError: name \'score\' is not defined</code>?', ['<code>score = 90<br>print(score)</code>','<code>print(score)</code>','<code>print("score")</code>'],1,
        ['This works because <code>score</code> is created before it is printed.','Correct. Python is asked to print <code>score</code>, but no variable named <code>score</code> was created first.','This prints the literal word score. Quotes prevent Python from looking for a variable.'],
        'If the name is unquoted and was never created, expect NameError.')}
      ${Q('per2','Which code would most likely create a SyntaxError?', ['<code>print("Hello")</code>','<code>print("Hello"</code>','<code>message = "Hello"</code>'],1,
        ['This is valid. The parentheses and quotes are closed.','Correct. The closing parenthesis is missing, so Python cannot parse the line.','This validly stores the text Hello in the variable <code>message</code>.'],
        'Syntax errors are grammar errors: missing colon, missing parenthesis, missing quote, or invalid structure.')}
      ${Q('per3','Which code would most likely create an IndentationError?', ['<code>if age > 18:<br>&nbsp;&nbsp;&nbsp;&nbsp;print("Adult")</code>','<code>if age > 18:<br>print("Adult")</code>','<code>age = 18<br>print(age)</code>'],1,
        ['This is valid because the action line is indented.','Correct. After the colon, Python expects the next block line to be indented.','This has no block, so there is no indentation issue.'],
        'A colon opens a block. The next line that belongs inside must be indented.')}
    `},
    running:{title:'▶️ Running Code: Top to Bottom',body:`

      ${outputDemo(['print("First")','print("Second")','print("Third")'],'First\nSecond\nThird')}
      ${outputDemo(['print(total)','total = 100'],'NameError: name \'total\' is not defined','This is what your screen will display as an error message')}
      ${explainBox('Python reaches <code>print(total)</code> before it reaches <code>total = 100</code>. At that moment, <code>total</code> does not exist yet.')}
      ${Q('pr1','Which version runs without an error?', ['<code>print(total)<br>total = 100</code>','<code>total = 100<br>print(total)</code>','<code>total == 100<br>print(total)</code>'],1,
        ['This fails because Python tries to print <code>total</code> before creating it.','Correct. The variable is created first, then displayed.','<code>==</code> compares instead of stores, so this does not create <code>total</code>.'],
        'Python is not guessing ahead. It follows the lines in order.')}
      ${Q('pr2','What appears on the screen?', ['<code>A<br>B</code>','<code>B<br>A</code>','Nothing appears'],0,
        ['Correct. Python runs the first print statement, then the second print statement.','Python does not start from the bottom. It runs top to bottom.','Both lines are print statements, so both display output.'],
        'For ordinary code, read from top to bottom unless a function call, loop, or condition changes the path.', ['print("A")','print("B")'])}
    `}
  };
  const l=lessons[id];
  document.getElementById('app').innerHTML=`
  <div style="padding:60px 0"><div class="wrap">
    <div class="back-link" onclick="showPrereqs()">← Back to Foundation</div>

const QD={};
function Q(id,q,opts,cor,rats,str,codeLs){
  ensureSeed();
  QD[id]={rats,str,cor};
  const dn=S.ans[id]!==undefined,pv=S.ans[id];
  const order=shuffleIndices('quiz-'+id,opts.length);
  let x=`<div class="quiz" id="q-${id}">`;
  if(codeLs)x+=cS(codeLs);
  x+=`<div class="quiz-q">${q}</div>`;
  order.forEach((orig)=>{
    const cl=dn?(orig===cor?'ok dn':(orig===pv&&pv!==cor?'no dn':'dn')):'';
    x+=`<div class="qo ${cl}" data-idx="${orig}" onclick="pQ('${id}',${orig})">${opts[orig]}</div>`;
  });
  x+=`<div id="qf-${id}">`;if(dn)x+=qfb(id,pv);x+=`</div></div>`;return x}
function qfb(id,sel){const d=QD[id];if(!d)return'';const ok=sel===d.cor;let x=`<div class="qfb ${ok?'qok':'qno'}"><strong>${ok?'✓ Correct.':'Not quite.'}</strong> ${d.rats[sel]}</div>`;if(d.str)x+=`<div class="strat"><b>📚 Strategy:</b> ${d.str}</div>`;return x}
function pQ(id,sel){
  if(S.ans[id]!==undefined)return;
  S.ans[id]=sel;save();
  const d=QD[id],ok=sel===d.cor;
  if(ok)addXP(10);
  const w=document.getElementById('q-'+id);
  w.querySelectorAll('.qo').forEach((o)=>{
    const orig=Number(o.dataset.idx);
    o.classList.add('dn');
    if(orig===d.cor)o.classList.add('ok');
    if(orig===sel&&sel!==d.cor)o.classList.add('no');
  });
  document.getElementById('qf-'+id).innerHTML=qfb(id,sel)
}



// Prompt-applied practice helpers: hints, check, try again, reveal. Student-facing output stays outside explanation boxes.
const PDATA={};
function P(id,hints,reveal,explain,output,correct){PDATA[id]={hints,reveal,explain,output:output||'',correct,tries:0,hintsSeen:{}};return ''}
function normP(v){return String(v||'').trim().replace(/\r\n/g,'\n').replace(/[ \t]+$/gm,'')}
function pControls(id,mode){return `<div class="practice-actions"><button class="btn btn-sm btn-blue" onclick="checkP('${id}','${mode}')">Check Answer</button><button class="btn btn-sm btn-ghost" onclick="tryP('${id}')">Try Again</button><button class="btn btn-sm btn-ghost" onclick="hintP('${id}',1)">Hint 1</button><button class="btn btn-sm btn-ghost" onclick="hintP('${id}',2)">Hint 2</button><button class="btn btn-sm btn-ghost" onclick="hintP('${id}',3)">Hint 3</button><button class="btn btn-sm btn-pink" id="rev-${id}" onclick="revealP('${id}')" disabled>Reveal Answer</button></div><div id="hint-${id}"></div><div id="fb-${id}" class="pfb"></div>`}
function pCard(type,title,prompt,body,id,mode){return `<div class="practice-card" id="pc-${id}"><span class="practice-type">${type}</span><h4>${title}</h4><p>${prompt}</p>${body}${pControls(id,mode)}</div>`}
function hintP(id,n){const d=PDATA[id];if(!d)return;d.hintsSeen[n]=true;document.getElementById(`hint-${id}`).innerHTML=`<div class="hint-box"><strong>Hint ${n}:</strong> ${d.hints[n-1]}</div>`;if(Object.keys(d.hintsSeen).length>=3 || d.tries>=2){const r=document.getElementById(`rev-${id}`);if(r)r.disabled=false}}
function tryP(id){const fb=document.getElementById(`fb-${id}`),h=document.getElementById(`hint-${id}`);if(fb)fb.innerHTML='';if(h)h.innerHTML='';document.querySelectorAll(`#pc-${id} textarea,#pc-${id} input`).forEach(x=>x.value='');document.querySelectorAll(`#pc-${id} select`).forEach(x=>x.value='');const b=document.getElementById(`build-${id}`);if(b)b.innerHTML=''}

function checkP(id,mode){const d=PDATA[id];if(!d)return;d.tries++;if(d.tries>=2){const r=document.getElementById(`rev-${id}`);if(r)r.disabled=false}let ok=false;
 if(mode==='type'){const v=normP(document.getElementById(`in-${id}`).value);ok=d.correct.map(normP).includes(v)}
 if(mode==='inputs'){ok=d.correct.every((alts,i)=>alts.map(x=>String(x).toLowerCase()).includes(String(document.getElementById(`${id}-i${i}`).value||'').trim().toLowerCase()))}
 if(mode==='selects'){ok=d.correct.every((ans,i)=>document.getElementById(`${id}-s${i}`).value===ans)}
 if(mode==='code'){const v=document.getElementById(`code-${id}`).value;ok=d.correct.every(r=>new RegExp(r,'i').test(v))}
 if(mode==='order'){const got=[...document.querySelectorAll(`#build-${id} .p-block`)].map(x=>x.dataset.v);ok=JSON.stringify(got)===JSON.stringify(d.correct)}
 if(mode==='debug'){const reason=document.getElementById(`${id}-reason`).value;const fix=document.getElementById(`${id}-fix`).value;ok=reason===d.correct.reason && d.correct.patterns.every(r=>new RegExp(r,'i').test(fix))}
 const fb=document.getElementById(`fb-${id}`);if(ok){addXP(8);fb.innerHTML=`<div class="qfb qok"><strong>Correct.</strong> ${d.explain}${d.output?simpleOutputDemo([],d.output,'Python output'):''}</div>`}else{fb.innerHTML=`<div class="qfb qno"><strong>Not quite.</strong> Use the hints to narrow the logic. The answer depends on line order, value movement, or the specific error Python reports.</div>`}}
function simpleOutputDemo(codeLines, output, label='Python output'){

  const code=codeLines&&codeLines.length?cS(codeLines):'';return `<div class="output-demo compact-output">${code}<div class="output-label-row"><div class="screen-label">${escHTML(label)}</div></div><div class="monitor-wrap"><div class="monitor">${value}</div></div></div>`}

 fnC:{tries:0,hints:{},ans:'calculate_age',ok:['calculate_age','calc_age','find_age','compute_age'],h:['This code does math. Use a math/action verb.','The function needs the birth year to calculate the age.','For now, name the job. In the full function later, the year will go inside the parentheses.'],good:'Correct. This function calculates the age. Later, the full function will need year inside the parentheses because the calculation depends on the birth year.'},

function normName(v){return v.trim().toLowerCase().replace(/^def\s+/,'').replace(/\(.*\)$/,'').replace(/\s+/g,'_')}
function ckNameTask(id){const t=NAME_TASKS[id],inp=document.getElementById(id),fb=document.getElementById(id+'-fb');let v=normName(inp.value);t.tries++;
 document.getElementById(id+'-reveal').disabled=!(t.tries>=3||Object.keys(t.hints).length>=3);
 if(!v){fb.innerHTML='<div class="hint-box" style="border-color:rgba(255,138,80,.35)">Type a function name first. Example format: <code>verb_thing</code>.</div>';return}
 if(v.includes('(')||v.includes(')')||v.startsWith('def')){fb.innerHTML='<div class="hint-box">Use a simple job name here, such as two lowercase words joined by an underscore.</div>';return}
 if(/^\d/.test(v)){fb.innerHTML='<div class="hint-box" style="border-color:rgba(255,82,82,.35)">A function name cannot start with a number. Start with an action word.</div>';return}
 if(t.ok.includes(v)){inp.classList.add('iok');fb.innerHTML=`<div class="qfb qok"><strong>✓ Correct.</strong> ${t.good}</div>`;addXP(5);checkAllNameTasks();return}
 const startsVerb=/^(get|ask|collect|calculate|calc|compute|find|show|display|print|check|validate|confirm|convert|format)/.test(v);
 if(!startsVerb)fb.innerHTML='<div class="qfb qno"><strong>Not yet.</strong> The name should start with an action verb, such as get, ask, calculate, display, check, convert, or format.</div>';
 else fb.innerHTML='<div class="qfb qno"><strong>Close.</strong> The verb is useful, but the name also needs the specific thing this task works with. Use the hints to narrow it.</div>';
}

function revealNameTask(id){const t=NAME_TASKS[id];document.getElementById(id+'-fb').innerHTML=`<div class="reveal-box">Suggested answer: ${t.ans}</div>`;document.getElementById(id).value=t.ans;document.getElementById(id).classList.add('iok');checkAllNameTasks()}

co:{t:'<span class="cc-col">:</span>',d:'The colon means: the function body begins next.'},

};const i=m[p];document.getElementById('pI').innerHTML=`<div class="teach blue" style="margin:0"><h3>${i.t}</h3><p>${i.d}</p></div>`}

function dcLoadChallenge(kind){
  DC.active=kind;DC.checks=0;DC.unlocked=0;DC.startTime=null;if(DC.hintTimer)clearInterval(DC.hintTimer);
  const d=DC.data[kind];
  const t=document.getElementById('dcTitle');if(!t)return;
  document.getElementById('dcTabPay').classList.toggle('active',kind==='pay');
  document.getElementById('dcTabBadge').classList.toggle('active',kind==='badge');
  document.getElementById('dcTitle').textContent=d.title;
  document.getElementById('dcPrompt').innerHTML=d.prompt;
  document.getElementById('dcCode').value=d.starter;
  document.getElementById('dcChecklist').innerHTML='';
  document.getElementById('dcConsole').innerHTML='<span class="warn">Workspace ready.</span> Write your functions, then click Check My Program.';
  document.getElementById('dcHints').innerHTML='';
  document.getElementById('dcHintFill').style.width='0%';
  document.getElementById('dcHintStatus').textContent='Timer not started.';
  document.getElementById('dcRevealBtn').disabled=true;
  document.getElementById('dcLineLab').innerHTML='';
  document.getElementById('dcTeach').innerHTML='<div class="dc-panel-title">Line explanation</div><p>Click a generated line on the left. The explanation will appear here.</p>';document.getElementById('dcTeach').style.transform='';document.getElementById('dcTeach').classList.remove('following-line');
}
function dcText(){return document.getElementById('dcCode').value}
function dcCheck(){
  DC.checks++;
  const d=DC.data[DC.active],txt=dcText();
  let passed=0,items='',guidance=[];
  d.checks.forEach(ch=>{
    const ok=ch.test(txt); if(ok)passed++;
    items+=`<div class="dc-checkitem ${ok?'ok':'no'}">${ok?'✓':'•'} ${ch.label}</div>`;
    if(!ok)guidance.push(ch.label);
  });
  document.getElementById('dcChecklist').innerHTML=items;
  const console=document.getElementById('dcConsole');
  if(passed===d.checks.length){
    console.innerHTML=`<span class="pass">Architect check passed.</span><br>Your program has the required structure. Preview the output, then click each line and read the right-side explanation.`;
    addXP(20); dcBuildLineLab(txt); document.getElementById('dcRevealBtn').disabled=false;
  }else{
    let msg='<span class="fail">Keep designing.</span><br>';
    if(/print\s*\(\s*hours\s*\*\s*rate\s*\)/.test(txt)||(/print\s*\(\s*.*gross.*\)/.test(txt)&&!/return/.test(txt))){
      msg+='Your calculation appears to print instead of return. If main() needs the value, the calculation function must return it.<br>';
    }
    if(!/def\s+main\s*\(\s*\)\s*:/.test(txt))msg+='Add a main() function to control the overall order.<br>';
    if(!/return/.test(txt))msg+='At least one worker function should return a value that another part of the program can use.<br>';
    msg+='Missing or weak areas:<br>• '+guidance.join('<br>• ');
    console.innerHTML=msg;
    if(DC.checks>=3)document.getElementById('dcRevealBtn').disabled=false;
  }
}
function dcRunPreview(){
  const d=DC.data[DC.active],txt=dcText();
  const ok=d.checks.every(ch=>ch.test(txt));
  document.getElementById('dcConsole').innerHTML= ok
    ? `<span class="pass">Predicted Python Output</span><div class="dc-mini-output">${simpleOutputDemo([],d.output,'Python output')}</div>`
    : `<span class="warn">Preview is not reliable yet.</span><br>Fix the structure first. The scanner needs the functions and return flow before it predicts output.`;
}
function dcStartTimedHints(){
  if(DC.hintTimer)clearInterval(DC.hintTimer);
  DC.startTime=Date.now();DC.unlocked=0;document.getElementById('dcHints').innerHTML='';
  dcTickHints();
  DC.hintTimer=setInterval(dcTickHints,1000);
}
function dcTickHints(){
  const elapsed=Math.floor((Date.now()-DC.startTime)/1000);
  document.getElementById('dcHintFill').style.width=(Math.min(180,elapsed)/180*100)+'%';
  const unlock=Math.min(3,Math.floor(elapsed/60)+1);
  if(unlock>DC.unlocked){
    DC.unlocked=unlock;
    const d=DC.data[DC.active];
    let html='';
    for(let i=0;i<unlock;i++)html+=`<div class="dc-hint-card"><strong>Hint ${i+1}:</strong> ${d.hints[i]}</div>`;
    document.getElementById('dcHints').innerHTML=html;
    if(unlock>=3)document.getElementById('dcRevealBtn').disabled=false;
  }
  const remaining=DC.unlocked>=3?0:60-(elapsed%60);
  document.getElementById('dcHintStatus').textContent=DC.unlocked>=3?'All hints unlocked. Reveal is available.':`Hint ${DC.unlocked} unlocked. Next hint in ${remaining}s.`;
}
function dcReveal(){
  const d=DC.data[DC.active];
  document.getElementById('dcCode').value=d.answer;
  document.getElementById('dcConsole').innerHTML=`<span class="pass">Suggested solution revealed.</span><br>Now click each line on the left and read the explanation panel on the right.`;
  document.getElementById('dcRevealBtn').disabled=false;
  dcBuildLineLab(d.answer);
  addXP(10);
}
function dcBuildLineLab(codeText){
  const lines=codeText.split('\n');
  document.getElementById('dcLineLab').innerHTML=lines.map((line,i)=>`<div class="dc-line" onclick="dcExplainLine(${i})"><span class="dc-line-num">${i+1}</span><span>${line?escHTML(line):' '}</span></div>`).join('');
}
function dcExplainLine(i){
  const line=(document.getElementById('dcCode').value.split('\n')[i]||'').trim();
  let msg='This blank line separates ideas so the program is easier to read.';
  if(/^def\s+main/.test(line))msg='This defines main(), the boss function. It controls the order of the whole program.';
  else if(/^def\s+/.test(line))msg='This defines a worker function. The body is saved and will not run until another line calls this function.';
  else if(/^return\b/.test(line))msg='This sends a value back to the place where the function was called. Use return when another function needs the result.';
  else if(/^print\s*\(/.test(line))msg='This displays something on the screen. It does not store the value for later.';
  else if(/=\s*get_/.test(line))msg='This calls an input/provider function and stores the value it returns in a variable.';
  else if(/=\s*(calc_|build_|format_)/.test(line))msg='This calls a worker function, receives the returned value, and stores it in a variable.';
  else if(/show_|display_/.test(line))msg='This calls a display function. The job is to show the final result to the user.';
  else if(/=/.test(line))msg='This line stores a value in a variable. The name on the left receives the result from the right side.';
  else if(/\w+\s*\(\s*\)/.test(line))msg='This is a function call. It tells Python to run the instructions saved under that function name.';
  const lineEls=[...document.querySelectorAll('.dc-line')];
  lineEls.forEach((el,idx)=>el.classList.toggle('active',idx===i));
  const teach=document.getElementById('dcTeach');
  if(window.innerWidth>880 && lineEls[i]){
    const y=Math.max(0,lineEls[i].offsetTop-6);
    teach.style.transform=`translateY(${y}px)`;
    teach.classList.add('following-line');
  }else{
    teach.style.transform='';
  }
  teach.innerHTML=`<div class="dc-panel-title">Line explanation</div><strong>Line ${i+1}</strong><code>${escHTML(line||'blank line')}</code><p>${msg}</p>`;
}
function dcCheckReflection(){
  const v=(document.getElementById('dcReflection').value||'').toLowerCase();
  const ok=v.includes('main')&&v.includes('return')&&(v.includes('print')||v.includes('display'));
  document.getElementById('dcReflectFb').innerHTML= ok
    ? '<div class="qfb qok"><strong>✓ Strong reflection.</strong> You connected main(), return, and display/print. That shows structural understanding.</div>'
    : '<div class="qfb qno"><strong>Keep sharpening it.</strong> Mention what main() controls, why return is needed, and where print/display happens.</div>';
  if(ok)addXP(8);
}
